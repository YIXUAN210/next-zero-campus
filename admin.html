<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXT ZERO 管理審核後台</title>
  <link rel="stylesheet" href="admin.css?v=20260831v2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 頂部導航列 -->
  <header class="admin-nav">
    <div class="nav-container">
      <div class="nav-brand">
        <span class="logo-icon">🌿</span>
        <span class="brand-text">NEXT ZERO 管理審核後台</span>
      </div>
      <div class="nav-actions">
        <a href="index.html" class="nav-link">⬅️ 返回前台拼圖</a>
        <button type="button" class="btn-logout" id="btn-logout" style="display: none;">登出</button>
      </div>
    </div>
  </header>

  <main class="admin-container">
    <!-- 登入驗證區塊 (Login Section) -->
    <section class="auth-section card" id="auth-section">
      <h2>🔐 管理員身分驗證</h2>
      <p class="auth-subtitle">請輸入管理員安全金鑰以載入全校任務審核清單</p>
      <form id="auth-form">
        <div class="form-group">
          <label for="admin-token">管理金鑰 (Token)</label>
          <input type="password" id="admin-token" placeholder="請輸入管理員安全金鑰" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary" id="btn-login">進入審核後台</button>
      </form>
    </section>

    <!-- 審核管理面板 (Dashboard Section, 登入後顯示) -->
    <section class="dashboard-section" id="dashboard-section" style="display: none;">
      <!-- 統計數據概覽 -->
      <div class="summary-cards">
        <div class="sum-card card">
          <h4>待審核件數</h4>
          <span class="sum-num text-pending" id="count-pending">0</span>
        </div>
        <div class="sum-card card">
          <h4>已通過件數</h4>
          <span class="sum-num text-approved" id="count-approved">0</span>
        </div>
        <div class="sum-card card">
          <h4>已退回件數</h4>
          <span class="sum-num text-rejected" id="count-rejected">0</span>
        </div>
      </div>

      <!-- 篩選與工具列 -->
      <div class="toolbar card">
        <div class="filter-group">
          <label>狀態篩選：</label>
          <button type="button" class="btn-filter active" data-filter="all">全部 (<span id="filter-all-count">0</span>)</button>
          <button type="button" class="btn-filter" data-filter="待審核">待審核 (<span id="filter-pending-count">0</span>)</button>
          <button type="button" class="btn-filter" data-filter="通過">已通過 (<span id="filter-approved-count">0</span>)</button>
          <button type="button" class="btn-filter" data-filter="退回">已退回 (<span id="filter-rejected-count">0</span>)</button>
        </div>
        <div class="tool-actions-group" style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" class="btn-refresh" id="btn-approve-all" style="color: #15803D; border-color: #86EFAC; background: #DCFCE7; font-weight: 800;">⚡ 一鍵全部通過 (統一審核)</button>
          <button type="button" class="btn-refresh" id="btn-refresh">🔄 重新整理</button>
          <button type="button" class="btn-refresh" id="btn-test-sample" style="color: #2E7D32; border-color: #A5D6A7; background: #E8F5E9;">🧪 建立測試案件</button>
          <button type="button" class="btn-refresh" id="btn-config-gas" style="color: #0284C7; border-color: #BAE6FD; background: #F0F9FF;">🌐 雲端 API 設定</button>
          <button type="button" class="btn-refresh" id="btn-clear-all" style="color: #DC2626; border-color: #FECACA; background: #FEF2F2;">🗑️ 清空所有案件</button>
        </div>
      </div>

      <!-- 卡片清單網格 -->
      <div class="submissions-grid" id="submissions-grid">
        <!-- JS 動態插入審核卡片 -->
      </div>
    </section>
  </main>

  <!-- 照片大圖與影片預覽 Modal -->
  <div class="modal-overlay" id="photo-modal">
    <div class="photo-modal-card">
      <button type="button" class="btn-close-photo" id="btn-close-photo">&times;</button>
      <div class="photo-modal-body">
        <img id="photo-modal-img" src="" alt="照片大圖預覽">
      </div>
      <div class="photo-modal-footer">
        <a id="photo-modal-drive-link" href="#" target="_blank" rel="noopener noreferrer" class="btn-open-drive">
          🔗 在 Google 雲端硬碟中開啟原始檔案 / 影片
        </a>
      </div>
    </div>
  </div>

  <script src="admin.js?v=20260831v11"></script>
</body>
</html>
